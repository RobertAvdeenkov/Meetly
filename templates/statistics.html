<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="meet.png" type="image/png">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #15590d;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .frame {
            border: 10px solid #fff;
            padding: 12px 24px;
        }

        h1 {
            color:#15590d;
        }

        h2 {
            color: #15590d;
        }

        .container {
            background-color: #fff;
            text-align: center;
            min-width: 40%;
            height: auto;
            padding: 12px 12px;
            border-radius: 0%;
        }

        .ots {
            padding: 8px 12px;
        }

        button {
            border-radius: 1%;
            background-color: #15590d;
            color: #fff;
            font-size: 24px;
            stroke-color: #fff;
        }

        input {
            color: #15590d;
        }
    </style>
</head>
<body>
    <div class="frame">
        <div class="container">
            <div id="content">
                <!-- Сюда будет вставлен контент -->
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const player = params.get('player') || 'Нет данных';
        const event = params.get('events') || 'Нет данных';
        const users = params.get('users') || 'Нет данных';

        // Теперь заменяем только содержимое #content, а не весь контейнер
        document.getElementById('content').innerHTML = `
            <h1>Всего пользователей:</h1>
            <h2>${users}</h2>
            <div class="ots"></div>
            <h1>Всего мероприятий:</h1>
            <h2>${event}</h2>
            <div class="ots"></div>
            <h1>Всего участников:</h1>
            <h2>${player}</h2>
            <div class="ots"></div>
        `;
    </script>
</body>
</html>
